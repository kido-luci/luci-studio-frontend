# CodeRabbit configuration — https://docs.coderabbit.ai/getting-started/configure-coderabbit
language: en-US
reviews:
  profile: chill          # 'chill' = focused, high-signal; 'assertive' = more nitpicks
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!dist/**"
    - "!**/*.min.js"
    - "!package-lock.json"
  path_instructions:
    - path: "src/**/*.astro"
      instructions: >-
        This is an Astro static site. The <style> block is scoped — elements
        created at runtime via innerHTML/createElement do NOT receive the scope
        attribute, so scoped CSS will not match them. Flag any runtime-created
        element that relies on a scoped class instead of inline styles.
chat:
  auto_reply: true
