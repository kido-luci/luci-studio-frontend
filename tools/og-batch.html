<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Per-page OG images — luci-studio blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* CSS is the proven blueprint sheet from tools/cover.html — kept in sync with it.
     This file renders ONE card per landing page, selected via ?key=<page>, and is
     screenshotted at 1200x630 by tools/og-gen.mjs into public/images/og/. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --blue:   #1b56ff;   /* luci-studio blueprint blue  */
    --orange: #f2542d;   /* luci-studio vermilion        */
    --orange-ink: #d8431f;/* darker orange for small text */
    --paper:  #efeee8;   /* warm drafting-sheet cream    */
    --ink:    #101a29;   /* near-black navy — headlines  */
    --ink-soft: #545c6a; /* body/secondary text          */
    --ink-faint:#9aa1ac; /* mono annotations             */
    --line:   rgba(16,26,41,0.08);  /* grid + rules      */
  }

  html, body { background: var(--paper); }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: "Space Grotesk", system-ui, sans-serif;
  }

  /* Screenshot THIS element at 1200x630 for an OG image. Inner sizes use cqw
     (1cqw = 1% card width) so it stays pixel-proportional. */
  .card {
    container-type: inline-size;
    width: 1200px;
    height: 630px;
    flex-shrink: 0;      /* never let a narrow window shrink the card — keeps screenshots exactly 1200x630 */
    position: relative;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
  }

  /* drafting grid */
  .card::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 0.1cqw, transparent 0.1cqw),
      linear-gradient(90deg, var(--line) 0.1cqw, transparent 0.1cqw);
    background-size: 3.2cqw 3.2cqw;
  }
  /* sheet frame */
  .card::after {
    content: "";
    position: absolute; inset: 2.3cqw;
    border: 0.1cqw solid rgba(16,26,41,0.14);
    pointer-events: none;
  }

  /* corner registration ticks */
  .tick { position: absolute; width: 2.2cqw; height: 2.2cqw; z-index: 3; }
  .tick::before, .tick::after { content: ""; position: absolute; background: var(--blue); }
  .tick::before { width: 100%; height: 0.14cqw; top: 0; }
  .tick::after  { height: 100%; width: 0.14cqw; left: 0; }
  .tick.tl { top: 2.9cqw; left: 2.9cqw; }
  .tick.tr { top: 2.9cqw; right: 2.9cqw; transform: scaleX(-1); }
  .tick.bl { bottom: 2.9cqw; left: 2.9cqw; transform: scaleY(-1); }
  .tick.br { bottom: 2.9cqw; right: 2.9cqw; transform: scale(-1); }

  .inner {
    position: relative; z-index: 2;
    height: 100%;
    padding: 5.6cqw 6.4cqw;
    display: grid;
    grid-template-columns: 1.12fr 0.88fr;
    gap: 3.6cqw;
    align-items: center;
  }
  /* title-led layout: single centered column, no figure */
  .card[data-layout="title"] .inner {
    grid-template-columns: 1fr;
    padding: 5.6cqw 8cqw;
  }
  .card[data-layout="title"] .right { display: none; }
  .card[data-layout="title"] .left { gap: 2.2cqw; max-width: 88cqw; }
  /* title-led covers get more room — bump the default size (cfg.titleSize still wins) */
  .card[data-layout="title"] .title { font-size: 8.4cqw; }

  /* ---------- left column ---------- */
  .left { display: flex; flex-direction: column; gap: 1.8cqw; }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.5cqw; font-weight: 600; letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--blue);
    display: flex; align-items: center; gap: 0.9cqw;
  }
  .eyebrow .sq { width: 1.15cqw; height: 1.15cqw; background: var(--orange); }
  .eyebrow .sep { color: var(--ink-faint); }
  .eyebrow .coord { color: var(--ink-faint); }

  /* Sentence-case title — matches the blog's Space Grotesk 700 header convention.
     cfg.titleSize overrides for long titles. */
  .title {
    font-family: "Space Grotesk", sans-serif;
    font-size: 7cqw;
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-wrap: balance;
    color: var(--ink);
  }
  .title .tdot { color: var(--blue); }

  .subtitle {
    font-family: "Space Grotesk", sans-serif;
    font-size: 2cqw; font-weight: 500; line-height: 1.3;
    color: var(--ink-soft);
    max-width: 46cqw;
    text-wrap: balance;
  }
  .card[data-layout="title"] .subtitle { max-width: 64cqw; }

  /* dimension rule under the title block */
  .dimline {
    display: flex; align-items: center; gap: 1cqw;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.4cqw; font-weight: 500; letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin-top: 0.2cqw;
  }
  .dimline .cap { width: 0.12cqw; height: 1.9cqw; background: rgba(16,26,41,0.28); flex-shrink: 0; }
  .dimline .rule { flex: 1; height: 0.12cqw; background: rgba(16,26,41,0.18); }

  .meta { display: flex; align-items: center; gap: 2.2cqw; margin-top: 0.4cqw; flex-wrap: wrap; }
  .m {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.7cqw; font-weight: 600; letter-spacing: 0.03em;
    display: inline-flex; align-items: center; gap: 0.6cqw;
  }
  .m-tag { color: var(--ink); padding-bottom: 0.2cqw; }
  .m-tag.t0 { border-bottom: 0.2cqw solid var(--blue); }
  .m-tag.t1 { color: var(--orange-ink); border-bottom: 0.2cqw solid var(--orange); }
  .m-tag .mark { color: var(--blue); }
  .m-tag.t1 .mark { color: var(--orange); }

  /* ---------- right column: drafting schematic ---------- */
  .right { position: relative; }
  .schematic {
    position: relative;
    border: 0.12cqw solid rgba(16,26,41,0.20);
    padding: 3cqw 2.6cqw 2.4cqw;
    background: rgba(255,255,255,0.35);
  }
  .fig {
    position: absolute; top: -1cqw; left: 1.5cqw;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.3cqw; font-weight: 600; letter-spacing: 0.12em;
    color: var(--blue); background: var(--paper); padding: 0 0.8cqw;
  }
  .nlabel {
    position: absolute; top: -1cqw; right: 1.5cqw;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.3cqw; font-weight: 600; letter-spacing: 0.06em;
    color: var(--ink-faint); background: var(--paper); padding: 0 0.8cqw;
  }
  .sch-cap {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.45cqw; color: var(--ink-soft); margin-bottom: 1.6cqw; letter-spacing: 0.02em;
  }
  .sch-cap b { color: var(--orange-ink); font-weight: 700; }

  .figbox { width: 100%; }
  .figbox svg { display: block; width: 100%; height: auto; }
  .figbox svg text {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    fill: var(--ink-soft);
  }
  .fig-stroke  { stroke: var(--blue); }
  .fig-accent  { stroke: var(--orange); }
  .fig-fill    { fill: rgba(255,255,255,0.9); }
  .fig-fillb   { fill: rgba(27,86,255,0.08); }
  .fig-filla   { fill: rgba(242,84,45,0.10); }

  .sch-note {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 1.3cqw; color: var(--ink-faint); letter-spacing: 0.03em;
    margin-top: 1.6cqw; display: flex; align-items: center; gap: 0.8cqw;
  }
  .sch-note::before { content: "▸"; color: var(--blue); }

  /* ---------- brand lockup (real logo asset, embedded as data URI) ---------- */
  .brand {
    position: absolute; z-index: 3;
    right: 4.2cqw; bottom: 3.1cqw;
    display: flex; align-items: center; gap: 1cqw;
    white-space: nowrap;
  }
  .brand .mark { width: 2.9cqw; height: 2.9cqw; border-radius: 0.7cqw; display: block; }
  .brand .wm {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.7cqw; font-weight: 700; letter-spacing: 0.005em;
    color: var(--ink);
  }
  .brand .wm::after { content: "."; color: var(--blue); }
</style>
</head>

    series: {

  const DEFAULTS = {

    brand: "luci studio",
    titleSize: "",

  /* ---- generic blueprint schematics (SVG, palette-driven via CSS classes) ---- */

          <line x1="42" y1="116" x2="110" y2="75"/>
          <line x1="110" y1="75" x2="182" y2="40"/>

        </g>
        <g stroke-width="2.4">
          <circle cx="42"  cy="34"  r="15" class="fig-stroke fig-fill"/>
          <circle cx="42"  cy="116" r="15" class="fig-stroke fig-fill"/>

          <line x1="110" y1="88" x2="110" y2="100"/>
        </g>

          <text x="44" y="31">client</text>
          <text x="44" y="73">api</text>
          <text x="44" y="115">store</text>

    // cell grid — good for data, arrays, matrices, tables
    grid: `
      <svg viewBox="0 0 220 150" role="img" aria-label="cell grid schematic">
        <g stroke-width="2.2">
          <rect x="24"  y="30" width="40" height="40" rx="3" class="fig-stroke fig-fill"/>

  function el(id) { return document.getElementById(id); }

  function render(cfg) {
    const card = el("card");
    card.setAttribute("data-layout", cfg.layout === "title" ? "title" : "figure");

    el("category").textContent = cfg.category;
    el("coord").textContent = cfg.coord;
    el("title").textContent = cfg.title;
    el("brandText").textContent = cfg.brand;

    const sub = el("subtitle");
    if (cfg.subtitle) { sub.textContent = cfg.subtitle; sub.style.display = ""; }
    else sub.style.display = "none";

    if (cfg.titleSize) el("title").parentElement.style.fontSize = cfg.titleSize;

    // landing OG cards carry no read-time/date/tags — meta stays empty
    el("meta").innerHTML = "";

    // schematic (figure layout only)
    if (card.getAttribute("data-layout") === "figure") {
      el("fig").textContent = cfg.figLabel || "FIG.01";
      const corner = el("nlabel");
      if (cfg.figCorner) { corner.textContent = cfg.figCorner; corner.style.display = ""; }
      else corner.style.display = "none";

      const cap = el("schCap");
      if (cfg.figCaption) { cap.textContent = cfg.figCaption; cap.style.display = ""; }
      else cap.style.display = "none";

      el("figbox").innerHTML = FIGURES[cfg.figure] || FIGURES.nodes;

      const note = el("note");
      if (cfg.figNote) { note.textContent = cfg.figNote; note.style.display = ""; }
      else note.style.display = "none";
    }
  }

  const key = new URLSearchParams(location.search).get("key") || "home";
  const page = PAGES[key];
  if (!page) {
    document.body.innerHTML = '<pre style="font:16px monospace;padding:2rem">Unknown ?key=' +
      key + '. Valid: ' + Object.keys(PAGES).join(", ") + '</pre>';
  } else {
    render({ ...DEFAULTS, ...page });
  }
  // signal readiness for the screenshot script (fonts settled + card painted)
  document.fonts.ready.then(() => { document.documentElement.setAttribute("data-og-ready", "1"); });
</script>
