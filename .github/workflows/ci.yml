name: CI

on:
  pull_request:

permissions:
  contents: read

# Cancel an in-progress run when a newer commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, build & unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The cheap gate first: `astro check` catches .astro/.ts type errors that
      # neither the unit tests nor the build surface (the build transpiles
      # without type-checking). Tuned to fail on errors only, so the handful of
      # pre-existing advisory hints don't block a PR.
      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      # The build fetches posts, series and lists from PUBLIC_API_URL and, as a
      # prod build, fails if that API is unreachable. No backend runs in CI, so
      # tools/ci/fixture-api.mjs serves a small fixed data set and the build
      # renders real post, /vi/ and series pages instead of an empty site.
      - name: Start fixture API
        run: |
          node tools/ci/fixture-api.mjs 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/posts > /dev/null && exit 0
            sleep 1
          done
          echo "fixture API did not start" >&2
          exit 1

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_URL: http://127.0.0.1:3000

      # The fixture pages rendered with their titles, the sitemap lists the
      # posts, the series and the static pages, and no page carries an inline
      # on*= handler (the CSP's script-src-attr 'none' would block it in
      # production).
      - name: Smoke check
        run: node tools/ci/smoke.mjs
